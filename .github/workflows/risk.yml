name: Risk Trader

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: risk-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install tradelocker pandas requests
      - run: python riskbot.py
        env:
          LIVE_CONFIRM: I_ACCEPT_THE_RISK
          TL_ENV: https://live.tradelocker.com
          SYMBOL: NAS100
          TIMEFRAME: 15m
          ACCOUNT_SIZE: "200"
          RISK_PCT: "1"
          DAILY_LOSS_PCT: "3"
          POINT_VALUE: "1.0"
          MAX_LOT: "0.05"
          TL_EMAIL: ${{ secrets.TL_EMAIL }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_SERVER: ${{ secrets.TL_SERVER }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: Save state
        if: always()
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add riskstate.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
