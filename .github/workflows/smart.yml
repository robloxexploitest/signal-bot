name: Smart Signals

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-signals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install tradelocker pandas requests
      - run: python smartbot.py
        env:
          TL_ENV: https://live.tradelocker.com
          SYMBOL: NAS100
          TIMEFRAME: 15m
          TL_EMAIL: ${{ secrets.TL_EMAIL }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_SERVER: ${{ secrets.TL_SERVER }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: Save results log
        if: always()
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add signals.json
          git diff --cached --quiet || (git commit -m "update signals log" && git push)
